<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DHAATU — E-Waste Collection Platform</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --ink:#161B1A; --ink-soft:#3A4442; --paper:#F3F1EA; --paper-dim:#E7E3D8; --line:#D8D2C2;
  --copper:#B5622E; --copper-deep:#8A4620; --verdigris:#3E7A64; --verdigris-deep:#2B5947;
  --circuit:#1F5C4D; --amber:#C08A2E; --red:#A63A2E; --card:#FBFAF6; --shadow:0 1px 0 rgba(22,27,26,.06);
  --radius-s:4px; --radius-m:8px;
  --font-display:'Iowan Old Style','Georgia',serif; --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:'SF Mono','Consolas',monospace; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[data-theme="dark"]{ --ink:#EFEBE2; --ink-soft:#B9B3A4; --paper:#14181A; --paper-dim:#1B211F; --line:#2B322F; --card:#1B211F; --copper:#D98A55; --verdigris:#5AA98A; --circuit:#4A9C82; color-scheme:dark; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow-x:hidden; max-width:100vw;}
html{scroll-padding-top:var(--safe-t);}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45; padding-top:var(--safe-t); padding-bottom:var(--safe-b); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:-.01em;}
button{font-family:inherit; cursor:pointer;} input,select,textarea{font-family:inherit; font-size:15px;} a{color:inherit;}
::selection{background:var(--copper); color:#fff;}
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--circuit); outline-offset:2px;}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch;} .scroll-x::-webkit-scrollbar{height:0;}
#app{max-width:1180px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}
.view{display:none; padding:0 0 84px;} .view.active{display:block; animation:viewIn .22s ease;}
@keyframes viewIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .view.active{animation:none} }
.topbar{position:sticky; top:0; z-index:40; background:var(--paper); border-bottom:1px solid var(--line); padding:calc(10px + var(--safe-t)) 16px 10px;}
.topbar-row{display:flex; align-items:center; gap:10px; justify-content:space-between;}
.brandmark{display:flex; align-items:center; gap:8px;} .brandmark svg{width:26px;height:26px;flex:none;}
.brand-name{font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:.01em;}
.brand-sub{font-size:10.5px; color:var(--ink-soft); letter-spacing:.04em; margin-top:-2px;}
.topbar-actions{display:flex; gap:6px; align-items:center;}
.icon-btn{width:38px;height:38px; border-radius:var(--radius-s); border:1px solid transparent; background:transparent; display:flex; align-items:center; justify-content:center; color:var(--ink); position:relative;}
.icon-btn:active{background:var(--paper-dim);} .icon-btn svg{width:19px;height:19px;}
.badge-dot{position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--copper); border:1.5px solid var(--paper);}
.page-title{padding:14px 16px 2px;} .page-title h1{font-size:24px;} .page-title p{margin:3px 0 0; color:var(--ink-soft); font-size:13.5px;}
.bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--card); border-top:1px solid var(--line); display:flex; padding-bottom:var(--safe-b); max-width:1180px; margin:0 auto;}
.bottomnav .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 8px; background:none; border:none; color:var(--ink-soft); font-size:10.5px; min-width:0;}
.bottomnav .nav-item svg{width:21px;height:21px;} .bottomnav .nav-item.active{color:var(--circuit);} .bottomnav .nav-item span{font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
@media (min-width:900px){
  #app{flex-direction:row; align-items:flex-start;}
  .sidebar{width:220px; flex:none; position:sticky; top:0; height:100vh; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 12px;}
  .sidebar .brandmark{padding:0 8px 22px;}
  .sidebar-nav{display:flex; flex-direction:column; gap:2px;}
  .sidebar-nav button{display:flex; align-items:center; gap:11px; padding:10px 10px; border-radius:var(--radius-s); background:none; border:none; color:var(--ink-soft); font-size:14px; text-align:left; font-weight:500; width:100%;}
  .sidebar-nav button svg{width:19px;height:19px;flex:none;}
  .sidebar-nav button.active{background:var(--paper-dim); color:var(--circuit); font-weight:700;}
  .sidebar-nav button:hover{background:var(--paper-dim);}
  .bottomnav{display:none;} .main-col{flex:1; min-width:0;} .view{padding-bottom:40px;}
}
.sidebar{display:none;} @media (min-width:900px){ .sidebar{display:flex;} }
.section{padding:14px 16px;} .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
.section-head h2{font-size:16.5px;} .section-head .link{font-size:12.5px; color:var(--circuit); font-weight:600; background:none; border:none;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow);}
.card-pad{padding:14px;} .stack{display:flex; flex-direction:column; gap:10px;}
.row{display:flex; align-items:center;} .row-between{display:flex; align-items:center; justify-content:space-between;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;} .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:11px 16px; border-radius:var(--radius-s); font-size:14px; font-weight:600; border:1px solid transparent; min-height:44px; transition:transform .08s ease, opacity .15s ease;}
.btn:active{transform:scale(.98);} .btn-primary{background:var(--circuit); color:#fff;} .btn-primary:active{background:var(--verdigris-deep);}
.btn-copper{background:var(--copper); color:#fff;} .btn-secondary{background:transparent; border-color:var(--line); color:var(--ink);}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:none; border:none; color:var(--circuit); padding:8px 4px; min-height:auto;} .btn-danger{background:transparent; border-color:var(--red); color:var(--red);}
.btn-block{width:100%;} .btn-sm{padding:7px 12px; font-size:12.5px; min-height:34px;}
.btn[disabled], .btn:disabled{opacity:.45; pointer-events:none; cursor:not-allowed;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;} .field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.field input, .field select, .field textarea{padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--paper); color:var(--ink); width:100%;}
.field textarea{resize:vertical; min-height:70px;} .field .hint{font-size:11.5px; color:var(--ink-soft);}
.hint{font-size:11.5px; color:var(--ink-soft); display:block;}
.field .error{font-size:11.5px; color:var(--red); display:none;} .field.has-error input, .field.has-error select{border-color:var(--red);} .field.has-error .error{display:block;}
.seg{display:flex; border:1px solid var(--line); border-radius:var(--radius-s); overflow:hidden;}
.seg button{flex:1; padding:9px 6px; background:var(--card); border:none; font-size:12.5px; font-weight:600; color:var(--ink-soft); border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;} .seg button.active{background:var(--circuit); color:#fff;}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; letter-spacing:.01em;}
.tag-verdigris{background:rgba(62,122,100,.14); color:var(--verdigris-deep);} .tag-copper{background:rgba(181,98,46,.14); color:var(--copper-deep);}
.tag-amber{background:rgba(192,138,46,.16); color:#8a611c;} .tag-red{background:rgba(166,58,46,.13); color:var(--red);} .tag-neutral{background:var(--paper-dim); color:var(--ink-soft);}
[data-theme="dark"] .tag-verdigris{color:#8fd8bb;} [data-theme="dark"] .tag-copper{color:#f0b98a;} [data-theme="dark"] .tag-amber{color:#e6c27a;} [data-theme="dark"] .tag-red{color:#f0a89e;}
.list-row{display:flex; align-items:center; gap:11px; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--card);}
.list-row:last-child{border-bottom:none;} .list-row:active{background:var(--paper-dim);}
.avatar{width:40px;height:40px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#fff; background:var(--verdigris);}
.thumb{width:52px;height:52px;border-radius:var(--radius-s); object-fit:cover; flex:none; background:var(--paper-dim); border:1px solid var(--line);}
.list-main{flex:1; min-width:0;} .list-title{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.list-sub{font-size:12px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.list-end{text-align:right; flex:none;} .chev{color:var(--ink-soft); flex:none;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px;}
.stat .num{font-family:var(--font-display); font-size:21px; font-weight:700;} .stat .lbl{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.stat .delta{font-size:10.5px; font-weight:700; margin-left:4px;} .delta-up{color:var(--verdigris-deep);} .delta-down{color:var(--red);}
.empty{display:flex; flex-direction:column; align-items:center; text-align:center; padding:40px 20px; color:var(--ink-soft);}
.empty svg{width:44px;height:44px; margin-bottom:10px; opacity:.5;} .empty h3{color:var(--ink); font-size:15px; margin-bottom:4px;} .empty p{font-size:13px; max-width:260px; margin:0 0 14px;}
.overlay{position:fixed; inset:0; background:rgba(15,18,17,.5); z-index:100; display:none; align-items:flex-end;}
.overlay.active{display:flex;} @media (min-width:640px){ .overlay.active{align-items:center; justify-content:center;} }
.sheet{background:var(--paper); width:100%; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; animation:sheetUp .24s ease; padding-bottom:calc(20px + var(--safe-b));}
@keyframes sheetUp{from{transform:translateY(100%)} to{transform:translateY(0)}}
@media (min-width:640px){ .sheet{max-width:480px; border-radius:12px; max-height:85vh; animation:none;} }
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 0;} @media (min-width:640px){ .sheet-handle{display:none;} }
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px 4px;} .sheet-head h3{font-size:17px;}
.sheet-body{padding:12px 16px 4px;}
.toast-wrap{position:fixed; left:0; right:0; bottom:calc(70px + var(--safe-b)); z-index:200; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
@media (min-width:900px){ .toast-wrap{bottom:24px;} }
.toast{background:var(--ink); color:var(--paper); padding:11px 16px; border-radius:8px; font-size:13.5px; font-weight:500; box-shadow:0 6px 18px rgba(0,0,0,.22); max-width:88vw; animation:toastIn .2s ease; display:flex; align-items:center; gap:8px;}
[data-theme="dark"] .toast{background:var(--paper); color:var(--ink);}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.skel{background:linear-gradient(90deg,var(--paper-dim) 25%,var(--line) 37%,var(--paper-dim) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:var(--radius-s);}
@keyframes skel{0%{background-position:100% 0}100%{background-position:0 0}}
.timeline{position:relative; padding-left:26px;} .timeline::before{content:'';position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--line);}
.tl-item{position:relative; padding-bottom:20px;} .tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute; left:-26px; top:1px; width:18px;height:18px; border-radius:50%; background:var(--paper-dim); border:2px solid var(--line); display:flex; align-items:center; justify-content:center;}
.tl-item.done .tl-dot{background:var(--circuit); border-color:var(--circuit);} .tl-item.done .tl-dot svg{width:10px;height:10px; stroke:#fff;}
.tl-item.current .tl-dot{border-color:var(--copper); background:var(--card);}
.tl-time{font-size:11px; color:var(--ink-soft); margin-top:1px;} .tl-title{font-weight:600; font-size:13.5px;} .tl-item.pending .tl-title{color:var(--ink-soft);}
.pill-scroll{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px;}
.pill{flex:none; padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:var(--card); font-size:12.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
.pill.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
hr.rule{border:none; border-top:1px solid var(--line); margin:14px 0;}
.kv{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line);} .kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink-soft);} .kv .v{font-weight:600;} .mono{font-family:var(--font-mono); font-size:12px;}
.center-note{text-align:center; color:var(--ink-soft); font-size:12.5px; padding:8px 0;}
.auth-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:28px 22px; max-width:420px; margin:0 auto;}
.auth-logo{display:flex; align-items:center; gap:10px; margin-bottom:26px;}
.auth-logo svg{width:38px;height:38px;} .auth-logo .n{font-family:var(--font-display); font-size:26px; font-weight:700;}
.auth-logo .s{font-size:11px; color:var(--ink-soft); letter-spacing:.06em;}
.role-card{display:flex; align-items:center; gap:12px; padding:14px; border:1.5px solid var(--line); border-radius:var(--radius-m); margin-bottom:10px; background:var(--card); cursor:pointer;}
.role-card.selected{border-color:var(--circuit); background:rgba(31,92,77,.06);}
.role-card svg{width:24px;height:24px; color:var(--circuit); flex:none;}
.otp-row{display:flex; gap:8px; margin:16px 0;} .otp-row input{width:100%; text-align:center; font-size:20px; padding:12px 0; letter-spacing:.05em;}
.map-wrap{position:relative; background:#DCE8DE; border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
[data-theme="dark"] .map-wrap{background:#182420;}
.map-marker{cursor:pointer;} .map-marker circle.pulse{animation:pulse 2s ease-out infinite;}
@keyframes pulse{0%{opacity:.5; r:8} 100%{opacity:0; r:22}}
.mini-actions{display:flex; gap:8px; margin-top:10px;}
.step-progress{display:flex; gap:4px; margin-bottom:16px;}
.step-progress .dot{flex:1; height:3px; border-radius:2px; background:var(--line);}
.step-progress .dot.done, .step-progress .dot.active{background:var(--circuit);}
.upload-box{border:1.5px dashed var(--line); border-radius:var(--radius-m); padding:26px 16px; text-align:center; color:var(--ink-soft); cursor:pointer; background:var(--card); display:block;}
.upload-box svg{width:30px;height:30px; margin-bottom:8px;}
.upload-preview{position:relative; border-radius:var(--radius-m); overflow:hidden; border:1px solid var(--line);}
.upload-preview img{width:100%; display:block; max-height:240px; object-fit:cover;}
.confidence-bar{height:6px; background:var(--paper-dim); border-radius:3px; overflow:hidden; margin-top:4px;}
.confidence-bar > div{height:100%; background:var(--circuit);}
.spark{display:flex; align-items:flex-end; gap:2px; height:34px;}
.spark div{flex:1; background:var(--verdigris); border-radius:1px 1px 0 0; opacity:.85;}
[data-theme="dark"] .spark div{background:var(--verdigris);}

svg{width:20px; height:20px; flex:none;}
.map-wrap svg{height:auto;}
.btn svg{width:17px; height:17px;}
.btn-sm svg{width:15px; height:15px;}
.btn-ghost svg{width:16px; height:16px;}
.tag svg{width:13px; height:13px;}
.avatar svg{width:20px; height:20px;}
.list-title svg{width:14px; height:14px; vertical-align:-2px;}
.chev svg{width:18px; height:18px;}
.toast svg{width:16px; height:16px;}
.tl-dot svg{width:10px; height:10px;}
.card-pad > svg{width:24px; height:24px; display:block; margin:0 auto 3px;}
.delta{font-size:11px; font-weight:700;}
.pill-scroll{padding-bottom:4px; scrollbar-width:none;}
.pill-scroll::-webkit-scrollbar{height:0;}

.mp-toolbar{display:flex; gap:8px; align-items:stretch;}
.mp-search{flex:1; position:relative; min-width:0;}
.mp-search > svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft); pointer-events:none;}
.mp-search input{width:100%; padding:10px 12px 10px 34px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--card); color:var(--ink);}
.mp-sort{position:relative; flex:none;}
.mp-sort select{appearance:none; -webkit-appearance:none; -moz-appearance:none; height:100%; padding:10px 30px 10px 12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--card); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer;}
.mp-sort::after{content:''; position:absolute; right:12px; top:50%; width:6px; height:6px; border-right:2px solid var(--ink-soft); border-bottom:2px solid var(--ink-soft); transform:translateY(-70%) rotate(45deg); pointer-events:none;}
.mp-count{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; font-weight:600;}
.rcy-card{padding:13px 14px; border-bottom:1px solid var(--line); background:var(--card); cursor:pointer;}
.rcy-card:last-child{border-bottom:none;} .rcy-card:active{background:var(--paper-dim);}
.rcy-top{display:flex; gap:11px; align-items:flex-start;} .rcy-info{flex:1; min-width:0;}
.rcy-name{font-weight:700; font-size:14px; display:flex; align-items:center; gap:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rcy-name .vbadge{color:var(--circuit); display:inline-flex;}
.rcy-meta{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.rcy-chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;}
.chip{font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; background:var(--paper-dim); color:var(--ink-soft); white-space:nowrap;}
.chip.on{background:rgba(31,92,77,.13); color:var(--circuit);}
.cap-bar{height:5px; border-radius:3px; background:var(--paper-dim); overflow:hidden; margin-top:10px;}
.cap-bar > div{height:100%; background:var(--circuit); border-radius:3px; transition:width .3s;}
.cap-bar.warn > div{background:var(--amber);} .cap-bar.full > div{background:var(--red);}
.rcy-foot{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; font-size:11.5px; color:var(--ink-soft);}
.rcy-foot .go{color:var(--circuit); font-weight:700;}
.price-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line);}
.price-row:last-child{border-bottom:none;} .price-main{flex:1; min-width:0;}
.price-cat{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.price-unit{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.price-spark{width:64px; flex:none;} .price-val{flex:none; text-align:right; min-width:74px;}
.price-num{font-weight:700; font-size:14px;} .price-delta{font-size:11px; font-weight:700; margin-top:2px;}
.price-delta.up{color:var(--verdigris-deep);} .price-delta.down{color:var(--red);}
[data-theme="dark"] .price-delta.up{color:#8fd8bb;} [data-theme="dark"] .price-delta.down{color:#f0a89e;}

:root{
  --ui-bg:#0c0f0f; --ui-bg-2:#111615; --ui-surface:#141917; --ui-surface-2:#191e1c; --ui-surface-3:#202623;
  --ui-text:#f2efe8; --ui-muted:#999f9a; --ui-dim:#707873;
  --ui-border:rgba(235,239,232,.095); --ui-border-strong:rgba(235,239,232,.16);
  --ui-accent:#86d9a9; --ui-accent-2:#c0f0d2; --ui-warm:#ef9b60; --ui-danger:#e78f86;
  --ui-shadow:0 22px 70px rgba(0,0,0,.30), 0 2px 8px rgba(0,0,0,.20);
  --ui-shadow-soft:0 10px 30px rgba(0,0,0,.16);
  --ui-radius-xs:10px; --ui-radius-sm:14px; --ui-radius-md:18px; --ui-radius-lg:24px; --ui-radius-xl:30px;
  --ui-content:1120px; --ui-ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme="light"]{
  --ui-bg:#f3f2ed; --ui-bg-2:#ecebe5; --ui-surface:#fbfaf6; --ui-surface-2:#f5f4ef; --ui-surface-3:#eeece4;
  --ui-text:#151917; --ui-muted:#6a726c; --ui-dim:#858c86;
  --ui-border:rgba(21,25,23,.09); --ui-border-strong:rgba(21,25,23,.15);
  --ui-shadow:0 22px 60px rgba(40,45,42,.11), 0 2px 10px rgba(40,45,42,.08);

.tag-copper{background:rgba(201,255,88,.10);color:var(--copper)}
.tag-amber{background:rgba(255,211,106,.10);color:var(--amber)}

.list-title{font-size:13px;font-weight:690}

.chev{color:var(--ink-soft)}
.pill-scroll{gap:7px;padding-bottom:6px}
.pill{padding:8px 13px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:11.5px}

.empty{padding:56px 24px;color:var(--ink-soft)}

.mp-toolbar{gap:10px}
.mp-search input{padding:12px 14px 12px 37px;border-radius:999px}

.mp-sort select{height:100%;border-radius:999px;background:rgba(255,255,255,.035);border-color:var(--line);padding:10px 35px 10px 14px}

.rcy-card{padding:18px 16px;background:transparent;border-bottom:1px solid var(--line);transition:background .18s ease,transform .18s ease}

.rcy-name{font-size:14px} .rcy-meta{font-size:11.5px}
.rcy-chips{gap:5px;margin-top:9px}
.chip{padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.05);font-size:10.5px}

.cap-bar{height:4px;background:rgba(255,255,255,.08);margin-top:11px}
.cap-bar>div{background:var(--copper)}
.price-row{padding:14px 16px;background:transparent}
.price-num{font-size:14px}
.map-wrap{background:rgba(255,255,255,.025);border-color:var(--line);border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.018)}
[data-theme="light"] .map-wrap{background:rgba(255,255,255,.62)}
.sheet-head{padding:18px 20px 8px}.sheet-head h3{font-size:18px;letter-spacing:-.035em}.sheet-body{padding:14px 20px 20px}
.sheet-handle{background:rgba(255,255,255,.18)}
.auth-wrap{min-height:100vh;max-width:980px;padding:34px 28px;display:grid;grid-template-columns:1.15fr .85fr;gap:54px;align-items:center;position:relative}
.auth-wrap::before{content:"";position:absolute;width:480px;height:480px;left:-180px;top:-120px;border-radius:50%;filter:blur(100px);background:rgba(201,255,88,.08);z-index:-1;animation:authFloat 16s ease-in-out infinite alternate}
.auth-wrap::after{content:"";position:absolute;width:400px;height:400px;right:-150px;bottom:-120px;border-radius:50%;filter:blur(100px);background:rgba(104,125,255,.09);z-index:-1;animation:authFloat2 19s ease-in-out infinite alternate}
@keyframes authFloat{from{transform:translate3d(0,0,0)}to{transform:translate3d(80px,40px,0)}}
@keyframes authFloat2{from{transform:translate3d(0,0,0)}to{transform:translate3d(-60px,-45px,0)}}
.auth-logo{grid-column:1;align-self:start;margin:0;padding-top:18px;gap:12px}

.auth-wrap #authBody{grid-column:2;grid-row:1 / span 2;width:100%;max-width:430px;justify-self:end;padding:28px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.035);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:var(--shadow)}
.auth-wrap #authBody h2{font-family:var(--font-display)!important;font-size:34px!important;line-height:1.02;letter-spacing:-.055em;margin-bottom:9px!important;font-weight:760}
.role-card{padding:15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025);transition:border-color .18s,background .18s,transform .18s}
.role-card:hover{background:rgba(255,255,255,.05);transform:translateY(-1px)}
.role-card.selected{border-color:rgba(201,255,88,.45);background:rgba(201,255,88,.07);box-shadow:0 0 0 4px rgba(201,255,88,.06)}
.otp-row{gap:7px}.otp-row input{border-radius:14px;border-color:var(--line);background:rgba(255,255,255,.035);font-size:23px}
.step-progress{gap:6px;margin-bottom:22px}.step-progress .dot{height:4px;border-radius:999px;background:rgba(255,255,255,.10)}.step-progress .dot.done,.step-progress .dot.active{background:var(--copper)}
.upload-box{border:1px dashed rgba(255,255,255,.18);border-radius:18px;padding:46px 18px;background:rgba(255,255,255,.025);transition:border-color .18s,background .18s,transform .18s}
.upload-box:hover{border-color:rgba(201,255,88,.42);background:rgba(201,255,88,.035);transform:translateY(-1px)}
.upload-preview{border-radius:18px;border-color:var(--line)}
.upload-preview img{max-height:330px}
.confidence-bar{height:5px;background:rgba(255,255,255,.08)}.confidence-bar>div{background:var(--copper)}
@media(max-width:899px){

[data-theme="dark"] .card[style*="background"]{background:var(--card)!important}
[data-theme="dark"] .card[style*="color"]{color:var(--ink)!important}
[data-theme="dark"] [style*="background:#fff"]{background:var(--card-strong)!important}
[data-theme="dark"] [style*="background: #fff"]{background:var(--card-strong)!important}
[data-theme="dark"] [style*="background:white"]{background:var(--card-strong)!important}
[data-theme="dark"] [style*="color:#fff"]{color:#f8f8f4!important}
[data-theme="dark"] [style*="color: #fff"]{color:#f8f8f4!important}
.view.active > .section,.auth-wrap > *{animation:riseIn .52s cubic-bezier(.22,.61,.36,1) both}
.view.active > .section:nth-child(2){animation-delay:.02s}.view.active > .section:nth-child(3){animation-delay:.05s}.view.active > .section:nth-child(4){animation-delay:.08s}.view.active > .section:nth-child(5){animation-delay:.11s}.view.active > .section:nth-child(6){animation-delay:.14s}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.active > .section,.auth-wrap > *{animation:none!important}}
html,body{overflow-x:hidden;}

/* Remove the green glow in active nav buttons */

/* Fixed upload box */
.upload-box{
  display:block; width:100%; box-sizing:border-box;

  border-radius:16px; padding:42px 20px;

  background:rgba(255,255,255,.022);
  transition:border-color .18s,background .18s,transform .18s;
}

.upload-box .upload-title{font-weight:700;font-size:14px;color:var(--ink);margin-bottom:4px;}
.upload-box .upload-sub{font-size:12px;color:var(--ink-soft);}
.demo-scrap-wrap{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);}

/* ============ NEW LOGO + HOVER ANIMATION ============ */
.brand-logo{
  width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;

.brandmark:focus-visible .brand-logo{transform:scale(1.08) rotate(-8deg);box-shadow:0 10px 26px rgba(0,0,0,.28);}

/* Leaflet satellite map */
.leaflet-map-container{height:440px;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);position:relative;z-index:0;}

.leaflet-container{background:#0c1115!important;font-family:inherit!important;}
[data-theme="light"] .leaflet-container{background:#e6ebe6!important;}
.leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);}
.leaflet-popup-tip{background:var(--paper);}
.leaflet-popup-content{margin:10px 12px;font-size:12.5px;line-height:1.5;}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:0 6px 20px rgba(0,0,0,.2)!important;border-radius:10px!important;overflow:hidden;}
.leaflet-bar a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important;}
.leaflet-bar a:hover{background:var(--paper-dim)!important;}
.map-user-dot{width:18px;height:18px;border-radius:50%;background:#c9ff58;border:3px solid #fff;box-shadow:0 0 0 8px rgba(201,255,88,.25), 0 4px 14px rgba(0,0,0,.45);position:relative;}

.map-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}

.ni-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:700;}
.ni-amount{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:1;margin:8px 0 10px;letter-spacing:-.045em;}
.ni-note{font-size:11px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:5px;}
.ni-note svg{width:12px;height:12px;}
.withdraw-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--copper);color:#0a0b0b;border:0;
  border-radius:999px;padding:10px 14px;
  font-size:12px;font-weight:800;margin-top:12px;cursor:pointer;
  transition:transform .15s, background .15s;
}
.withdraw-btn:hover{background:#d2ff78;transform:translateY(-1px);}
.withdraw-btn svg{width:14px;height:14px;}

/* AI Identify card */
.ai-identify-card{
  border:1px solid var(--line);border-radius:20px;padding:20px;
  background:var(--card);display:flex;flex-direction:column;gap:14px;
  cursor:pointer;
}
.ai-id-head{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;letter-spacing:-.01em;}
.ai-id-head .ai-id-icon{
  width:32px;height:32px;border-radius:10px;
  background:rgba(201,255,88,.10);color:var(--copper);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(201,255,88,.20);
}
.ai-drop{
  border:1.5px dashed rgba(255,255,255,.22);border-radius:16px;
  padding:36px 20px;text-align:center;cursor:pointer;
  background:rgba(255,255,255,.015);
  transition:border-color .18s,background .18s;
}
.ai-drop:hover{border-color:rgba(201,255,88,.42);background:rgba(201,255,88,.03);}
.ai-drop-icon{
  width:52px;height:52px;border-radius:14px;margin:0 auto 12px;
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
}
.ai-drop-icon svg{width:24px;height:24px;}
.ai-drop-title{font-weight:700;font-size:13.5px;color:var(--ink);}
.ai-drop-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;max-width:280px;margin-left:auto;margin-right:auto;}

/* Listings */
.listing-card{
  border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:var(--card);display:flex;flex-direction:column;
}
.listing-hero{
  height:180px;background:linear-gradient(135deg,#1a2b1e,#0e1a12);
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.20);
}
.listing-hero svg{width:52px;height:52px;}
.listing-hero img{width:100%;height:100%;object-fit:cover;}
.listing-hero svg.lot-art{width:100%;height:100%;}
.listing-hero .listing-cat-badge{
  position:absolute;top:12px;left:12px;
  font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 12px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;
  backdrop-filter:blur(8px);
}
.listing-body{padding:16px 18px;}
.listing-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.listing-weight{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.listing-loc{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);}
.listing-loc svg{width:12px;height:12px;}
.listing-est{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:5px 10px;border-radius:8px;background:rgba(255,211,106,.10);color:#edce93;font-size:11px;font-weight:800;}
.listing-desc{font-size:12.5px;color:var(--ink-soft);margin:12px 0 10px;line-height:1.5;font-style:italic;}
.listing-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);padding-top:10px;border-top:1px dashed var(--line);}
.listing-bids-count{color:var(--copper);font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:10.5px;}
.your-bid-card{
  margin-top:14px;padding:16px;border:1px solid rgba(201,255,88,.24);
  border-radius:14px;background:rgba(201,255,88,.045);text-align:center;
}
.your-bid-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(201,255,88,.85);font-weight:800;display:inline-flex;align-items:center;gap:5px;}
.your-bid-label svg{width:12px;height:12px;}
.your-bid-amount{font-family:var(--font-display);font-size:30px;font-weight:800;color:var(--ink);margin:8px 0 4px;letter-spacing:-.035em;}
.your-bid-note{font-size:11.5px;color:var(--ink-soft);}

/* Live bids */
.live-bid{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);}
.live-bid:last-child{border-bottom:none;}
.live-bid-left{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.live-bid-amount{font-weight:800;color:var(--copper);font-size:15px;display:flex;align-items:center;gap:6px;}
.live-bid-source{font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-bid-tag{font-size:9px;font-weight:800;padding:2px 6px;border-radius:20px;background:rgba(126,217,87,.18);color:#a8e97a;letter-spacing:.06em;text-transform:uppercase;}
.live-bid-actions{display:flex;gap:6px;flex:none;}
.bid-action{font-size:11px;font-weight:800;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:all .15s;}
.bid-action.accept{background:var(--copper);color:#0a0b0b;border-color:var(--copper);}
.bid-action.accept:hover{background:#d2ff78;}
.bid-action.reject{color:var(--red);border-color:rgba(255,136,125,.28);}
.bid-action.reject:hover{background:rgba(255,136,125,.08);}

/* Bids table */
.bids-table{width:100%;border-collapse:collapse;}
.bids-table th,.bids-table td{text-align:left;padding:14px 16px;font-size:12.5px;border-bottom:1px solid var(--line);vertical-align:middle;}
.bids-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.10em;color:var(--ink-soft);font-weight:800;background:transparent;}
.bids-table tr:last-child td{border-bottom:none;}
.bids-table .col-bid{color:var(--copper);font-weight:800;font-size:14.5px;}
.bids-table .col-item-name{font-weight:700;font-size:13.5px;color:var(--ink);}
.bids-table .col-item-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:400;}
.hub-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.hub-tab{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 16px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.02);color:var(--ink-soft);
  font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;
}
.hub-tab:hover{color:var(--ink);background:rgba(255,255,255,.05);}
.hub-tab.active{background:var(--copper);color:#0a0b0b;border-color:var(--copper);}
.hub-tab svg{width:14px;height:14px;}
.hub-tab .count{
  font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px;
  background:rgba(255,255,255,.10);color:inherit;margin-left:2px;
}
.hub-tab.active .count{background:rgba(0,0,0,.18);}

/* Buying prices grid */
.bp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.bp-card{
  border:1px solid var(--line);border-radius:16px;padding:16px;
  background:rgba(255,255,255,.02);
  display:flex;flex-direction:column;gap:12px;
}
.bp-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.bp-card-name{font-weight:800;font-size:14px;letter-spacing:-.01em;}
.bp-status{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
.bp-status.active{background:rgba(126,217,87,.14);color:#a8e97a;}
.bp-status.unset{background:rgba(255,255,255,.06);color:var(--ink-soft);}
.bp-input-row{display:flex;gap:6px;align-items:stretch;}
.bp-input{
  flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);
  border-radius:11px;background:rgba(255,255,255,.035);color:var(--ink);
  font-size:14px;font-weight:800;font-family:inherit;outline:none;transition:all .15s;
}
.bp-input:focus{border-color:rgba(201,255,88,.5);box-shadow:0 0 0 3px rgba(201,255,88,.08);}
.bp-input.invalid{border-color:rgba(255,136,125,.5);}
.bp-update-btn{
  border:0;border-radius:11px;padding:11px 13px;
  background:rgba(255,255,255,.08);color:var(--ink);
  font-size:11.5px;font-weight:800;cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;
}
.bp-update-btn:hover{background:var(--copper);color:#0a0b0b;}
.bp-update-btn.dirty{background:var(--copper);color:#0a0b0b;}

/* Topbar layout */
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.topbar-right{display:flex;align-items:center;gap:6px;flex:none;}
.back-row{padding:10px 16px 0;}
.back-row .btn-ghost{min-height:40px;padding:8px 4px;}
.back-row .btn-ghost svg{width:17px;height:17px;display:block;}
.back-row .btn-ghost span{line-height:1;display:inline-flex;align-items:center;}
.step-progress button.dot{border:0;padding:0;cursor:pointer;}
.step-progress button.dot:not(.done){cursor:default;}
@media(max-width:620px){.dashboard-quick-grid{grid-template-columns:1fr 1fr;}}

/* Recycler dashboard */
.rec-dash-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:620px){.rec-dash-metrics{grid-template-columns:1fr;}}
.rec-metric-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;}
.rec-metric-card .num{font-family:var(--font-display);font-size:28px;font-weight:800;line-height:1;letter-spacing:-.04em;}
.rec-metric-card .lbl{font-size:11px;color:var(--ink-soft);}
.rec-metric-card .delta{font-size:11px;font-weight:700;margin-top:2px;}
.rec-capacity-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px;}
.rec-capacity-bar>div{height:100%;border-radius:4px;transition:width .4s;}
.rec-capacity-bar>div.warn{background:var(--amber);}
.rec-capacity-bar>div.danger{background:var(--red);}
.rec-capacity-bar>div.safe{background:var(--copper);}
.procurement-lot{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;}
.procurement-lot .lot-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.procurement-lot .lot-id{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);font-weight:600;}
.procurement-lot .lot-name{font-weight:800;font-size:14px;letter-spacing:-.01em;}
.procurement-lot .lot-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.procurement-lot .lot-meta span{font-size:11px;color:var(--ink-soft);background:rgba(255,255,255,.04);padding:3px 8px;border-radius:6px;}
.procurement-lot .lot-actions{display:flex;gap:8px;margin-top:4px;}
.ledger-table{width:100%;border-collapse:collapse;}
.ledger-table th,.ledger-table td{text-align:left;padding:12px 14px;font-size:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.ledger-table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:800;}
.ledger-table tr:last-child td{border-bottom:none;}
.ledger-cert{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
.ledger-cert.verified{background:rgba(141,224,207,.12);color:var(--verdigris);}
.ledger-cert.pending{background:rgba(255,211,106,.12);color:var(--amber);}
.ledger-cert.expired{background:rgba(255,136,125,.12);color:var(--red);}
.shipment-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);}
.shipment-row:last-child{border-bottom:none;}
.shipment-row .ship-icon{width:40px;height:40px;border-radius:12px;background:rgba(201,255,88,.10);color:var(--copper);display:flex;align-items:center;justify-content:center;flex:none;}
.shipment-row .ship-main{flex:1;min-width:0;}
.shipment-row .ship-title{font-weight:700;font-size:13.5px;}
.shipment-row .ship-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.shipment-row .ship-status{flex:none;}

/* Input safety */
input[inputmode="numeric"]{ font-variant-numeric: tabular-nums; letter-spacing: .02em; }
input[inputmode="decimal"]{ font-variant-numeric: tabular-nums; }
body.sheet-open { overflow: hidden; }
input:disabled{ opacity:.6; cursor: not-allowed; }

/* ============ PREMIUM ENTRY (LANDING) SCREEN ============ */
.entry-wrap{
  position:relative; min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
  overflow:hidden; padding:24px; isolation:isolate;
  background:linear-gradient(180deg, var(--ui-bg), var(--ui-bg-2));
}
.entry-bg-layer{position:absolute; inset:-20%; z-index:-3; pointer-events:none; opacity:.9;}
.entry-bg-layer-1{
  background:
    radial-gradient(720px 520px at 15% 25%, rgba(201,255,88,.14), transparent 60%),
    radial-gradient(520px 420px at 85% 20%, rgba(104,125,255,.10), transparent 65%);
  animation:gradShift1 22s ease-in-out infinite alternate;
}
.entry-bg-layer-2{
  background:
    radial-gradient(560px 460px at 80% 85%, rgba(201,255,88,.09), transparent 62%),
    radial-gradient(680px 520px at 10% 90%, rgba(104,125,255,.12), transparent 68%);
  animation:gradShift2 26s ease-in-out infinite alternate;
}
.entry-bg-layer-3{
  background:radial-gradient(900px 700px at 50% 50%, rgba(239,155,96,.055), transparent 70%);
  animation:gradShift3 30s ease-in-out infinite alternate;
}
@keyframes gradShift1{
  from{transform:translate3d(-3%,-2%,0) scale(1)}
  to{transform:translate3d(5%,4%,0) scale(1.06)}
}
@keyframes gradShift2{
  from{transform:translate3d(2%,3%,0) scale(1.02)}
  to{transform:translate3d(-4%,-3%,0) scale(1.08)}
}
@keyframes gradShift3{
  from{transform:translate3d(0,0,0) scale(1); opacity:.8}
  to{transform:translate3d(2%,-2%,0) scale(1.05); opacity:1}
}
.entry-dotgrid{
  position:absolute; inset:0; z-index:-2; pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 50%, #000 0%, transparent 78%);
          mask-image:radial-gradient(ellipse 60% 55% at 50% 50%, #000 0%, transparent 78%);
}
[data-theme="light"] .entry-dotgrid{
  background-image:radial-gradient(rgba(18,20,19,.10) 1px, transparent 1px);
}
.entry-blob{position:absolute; border-radius:50%; filter:blur(110px); pointer-events:none; z-index:-1;}
.entry-blob-a{width:520px;height:520px;top:-160px;left:-140px;background:radial-gradient(circle,rgba(201,255,88,.16),transparent 65%); animation:blobFloatA 16s ease-in-out infinite alternate;}
.entry-blob-b{width:480px;height:480px;bottom:-180px;right:-140px;background:radial-gradient(circle,rgba(104,125,255,.14),transparent 65%); animation:blobFloatB 19s ease-in-out infinite alternate-reverse;}
.entry-blob-c{width:380px;height:380px;top:40%;right:8%;background:radial-gradient(circle,rgba(239,155,96,.10),transparent 68%); animation:blobFloatC 23s ease-in-out infinite alternate;}
@keyframes blobFloatA{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(60px,40px,0) scale(1.08)}}
@keyframes blobFloatB{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-50px,-40px,0) scale(1.06)}}
@keyframes blobFloatC{from{transform:translate3d(0,0,0) scale(.96)}to{transform:translate3d(-40px,30px,0) scale(1.10)}}
@media (prefers-reduced-motion:reduce){.entry-blob-a,.entry-blob-b,.entry-blob-c,.entry-bg-layer{animation:none}}

.entry-theme-toggle{
  position:absolute; top:calc(16px + var(--safe-t)); right:16px; z-index:10;
  width:44px;height:44px; border-radius:50%;
  background:rgba(255,255,255,.06); border:1px solid var(--ui-border-strong);
  color:var(--ink); display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
  transition:transform .2s ease, background .2s ease, border-color .2s ease;
}
.entry-theme-toggle:hover{transform:scale(1.06); background:rgba(201,255,88,.12); border-color:rgba(201,255,88,.4);}
.entry-theme-toggle svg{width:20px;height:20px;}
[data-theme="light"] .entry-theme-toggle{background:rgba(255,255,255,.72);}

.entry-content{position:relative; z-index:1; text-align:center; max-width:680px; width:100%;}

.entry-logo-btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:180px; height:180px; border-radius:50%;
  background:rgba(255,255,255,.045);
  border:1px solid var(--ui-border-strong);
  cursor:pointer; margin-bottom:34px; padding:0;
  transition:transform .5s var(--ui-ease), border-color .35s ease, background .35s ease, box-shadow .35s ease;
  backdrop-filter:blur(14px) saturate(120%); -webkit-backdrop-filter:blur(14px) saturate(120%);
  box-shadow:0 30px 80px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.07);
  animation:entryFloat 4.4s ease-in-out infinite;
}
@keyframes entryFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
[data-theme="light"] .entry-logo-btn{background:rgba(255,255,255,.65); box-shadow:0 30px 80px rgba(40,45,42,.14), inset 0 1px 0 rgba(255,255,255,.85);}
@media (min-width:720px){ .entry-logo-btn{width:220px; height:220px;} }
.entry-logo-btn:hover{ transform:scale(1.05) translateY(-6px); border-color:rgba(201,255,88,.55); box-shadow:0 40px 100px rgba(201,255,88,.14), 0 30px 80px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.09); }
.entry-logo-btn:active{ transform:scale(1.02) translateY(-2px); }
.entry-logo-btn img{ width:62%; height:62%; object-fit:contain; border-radius:50%; filter:drop-shadow(0 20px 40px rgba(0,0,0,.4)); }
.entry-logo-ring{
  position:absolute; inset:-14px; border-radius:50%;
  border:1px solid rgba(201,255,88,.22);
  animation:ringPulse 2.6s ease-out infinite; pointer-events:none;
}
.entry-logo-ring-2{ inset:-28px; border:1px solid rgba(201,255,88,.12); animation-delay:.9s; }
.entry-logo-ring-3{ inset:-44px; border:1px solid rgba(201,255,88,.07); animation-delay:1.8s; }
@keyframes ringPulse{0%{transform:scale(.94); opacity:.85} 70%{transform:scale(1.14); opacity:0} 100%{opacity:0}}

.entry-title{
  font-family:var(--font-display);
  font-size:clamp(48px, 8vw, 84px);
  font-weight:800; letter-spacing:-.055em; line-height:1;
  margin:0 0 14px; color:var(--ink);
}
.entry-title .entry-dot{ color:var(--copper); }
.entry-sub{
  font-size:clamp(13.5px, 1.6vw, 15.5px); color:var(--ink-soft);
  max-width:520px; margin:0 auto 30px; line-height:1.6; letter-spacing:-.01em;
}
.entry-hint{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 20px; border-radius:999px;
  background:rgba(201,255,88,.09);
  border:1px solid rgba(201,255,88,.24);
  color:var(--copper);
  font-size:11.5px; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase;
  animation:entryPulse 2s ease-in-out infinite;
  cursor:pointer;
}
@keyframes entryPulse{0%,100%{opacity:.78; transform:translateY(0)} 50%{opacity:1; transform:translateY(-1px)}}
.entry-hint svg{ width:13px; height:13px; }

/* Staggered reveal */
.entry-reveal{ opacity:0; animation:entryReveal .85s cubic-bezier(.2,.7,.2,1) forwards; }
.entry-reveal-1{ animation-delay:.05s; }
.entry-reveal-2{ animation-delay:.25s; }
.entry-reveal-3{ animation-delay:.45s; }
.entry-reveal-4{ animation-delay:.65s; }
@keyframes entryReveal{
  from{opacity:0; transform:translateY(14px); filter:blur(8px);}
  to{opacity:1; transform:translateY(0); filter:blur(0);}
}
@media (prefers-reduced-motion:reduce){ .entry-reveal{ animation:none; opacity:1; } }

/* ============ POPUP MENUS — DEEP BLUR (enhanced) ============ */
.popup-wrap{ position:relative; }
.popup-menu{
  position:fixed; top:0; left:0;
  background:rgba(14,17,16,.92);
  border:1px solid var(--ui-border-strong);
  border-radius:16px; padding:8px;
  width:220px; max-width:calc(100vw - 24px);
  box-sizing:border-box;
  box-shadow:0 28px 80px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  z-index:70;
  backdrop-filter:blur(38px) saturate(165%);
  -webkit-backdrop-filter:blur(38px) saturate(165%);
  animation:popupIn .18s var(--ui-ease);

let _rulesEnHi = null, _rulesEnMr = null;
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function buildRules(dict){
  return Object.keys(dict).sort((a,b)=>b.length-a.length).map(key=>{
    const pre  = /^[A-Za-z0-9]/.test(key) ? '\\b' : '';
    const post = /[A-Za-z0-9]$/.test(key) ? '\\b' : '';
    return [new RegExp(pre + escapeRegExp(key) + post, 'g'), dict[key]];
  });
}
function rulesFor(lang){
  if(lang === 'hi'){ if(!_rulesEnHi) _rulesEnHi = buildRules(EN_HI); return {rules:_rulesEnHi, patterns:HI_PATTERNS}; }
  if(lang === 'mr'){ if(!_rulesEnMr) _rulesEnMr = buildRules(EN_MR); return {rules:_rulesEnMr, patterns:MR_PATTERNS}; }
  return {rules:[], patterns:[]};
}
function translateValue(value){
  const lang = state.settings.language || 'en';
  if(lang === 'en' || !value) return value;
  let out = String(value);
  const {rules, patterns} = rulesFor(lang);
  for(const [re, rep] of patterns){ re.lastIndex = 0; out = out.replace(re, rep); }
  for(const [re, rep] of rules){ re.lastIndex = 0; out = out.replace(re, rep); }
  return out;
}
function translateRenderedContent(root){
  const lang = state.settings.language || 'en';
  if(lang === 'en') return;
  const scope = (root && root.body) ? root.body : (root || document.body);
  if(!scope) return;
  const dict = lang === 'mr' ? EN_MR : EN_HI;
  const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const p = node.parentElement;
    if(!p) return;
    const tag = p.tagName;
    if(tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT') return;
    const original = node.nodeValue;
    if(!original || !original.trim()) return;
    const trimmed = original.trim();
    if(Object.prototype.hasOwnProperty.call(dict, trimmed)){
      const i = original.indexOf(trimmed);
      node.nodeValue = original.slice(0, i) + dict[trimmed] + original.slice(i + trimmed.length);
      return;
    }
    const translated = translateValue(original);
    if(translated !== original) node.nodeValue = translated;
  });
  const attrScope = scope.querySelectorAll ? scope : document;
  attrScope.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{
    ['placeholder','aria-label','title'].forEach(attr=>{
      if(el.hasAttribute(attr)) el.setAttribute(attr, translateValue(el.getAttribute(attr)));
    });
  });
}

    currentRoute = {name:'recDashboard', params:{}}; routeStack = [];
  }
}

function goHome(){
  currentRoute = {name: isCollector() ? 'dashboard' : 'recDashboard', params:{}};
  routeStack = [];
  try{ history.pushState({route:{name:currentRoute.name, params:{}}, stackLen:0}, ''); }catch(e){}
  render();
  window.scrollTo(0,0);
}

function navigate(name, params={}, opts={}){
  if(!opts.silent) routeStack.push(currentRoute);
  currentRoute = {name, params};
  try{
    history.pushState({route:{name, params}, stackLen: routeStack.length}, '');
  }catch(e){ /* ignore */ }
  render();
  window.scrollTo(0,0);
}
function goBack(fallback){
  if(routeStack.length){ currentRoute = routeStack.pop(); }
  else currentRoute = {name: fallback || (isCollector()?'dashboard':'recDashboard'), params:{}};
  try{ history.replaceState({route:currentRoute, stackLen: routeStack.length}, ''); }catch(e){}
  render(); window.scrollTo(0,0);
}

window.addEventListener('popstate', function(){
  if(!state.entered){ return; }
  if(!state.session || !state.session.loggedIn){ return; }
  if(routeStack.length){
    currentRoute = routeStack.pop();
  } else {
    currentRoute = {name: isCollector() ? 'dashboard' : 'recDashboard', params:{}};
  }
  render();
  window.scrollTo(0,0);
});

function analyzeImage(dataUrl){
  return new Promise(function(resolve, reject){
    if(!dataUrl){ reject(new Error('no image')); return; }
    var img = new Image();
    img.onload = function(){
      try{
        var maxDim = 96;
        var longest = Math.max(img.width, img.height) || 1;
        var scale = Math.min(1, maxDim / longest);
        var w = Math.max(4, Math.round((img.width  || 1) * scale));
        var h = Math.max(4, Math.round((img.height || 1) * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var data = ctx.getImageData(0, 0, w, h).data;
        var n = w * h;
        var sumR=0, sumG=0, sumB=0;
        var greenCount=0, copperCount=0, grayCount=0, darkCount=0, brightCount=0;
        var satSum = 0;
        var lum = new Float32Array(n);
        for(var i=0;i<n;i++){
          var r = data[i*4], g = data[i*4+1], b = data[i*4+2];
          sumR += r; sumG += g; sumB += b;
          var mx = Math.max(r,g,b), mn = Math.min(r,g,b);
          var sat = mx === 0 ? 0 : (mx - mn) / mx;
          satSum += sat;
          var L = 0.2126*r + 0.7152*g + 0.0722*b;
          lum[i] = L;
          if(L < 60) darkCount++;
          else if(L > 200) brightCount++;
          if(sat < 0.12) grayCount++;
          if(g > r + 10 && g >= b + 8 && sat > 0.15) greenCount++;
          if(r > g && g >= b && (r - b) > 40 && sat > 0.25 && L > 60) copperCount++;
        }
        var avgR = sumR/n, avgG = sumG/n, avgB = sumB/n;
        var brightness = 0.2126*avgR + 0.7152*avgG + 0.0722*avgB;
        var avgSat = satSum/n;
        var edgeSum = 0;
        for(var y=1;y<h-1;y++){
          for(var x=1;x<w-1;x++){
            var idx = y*w + x;
            var gx = lum[idx+1] - lum[idx-1];
            var gy = lum[idx+w] - lum[idx-w];
            edgeSum += Math.sqrt(gx*gx + gy*gy);
          }
        }
        var denom = Math.max(1, (w-2) * (h-2));
        var edgeDensity = edgeSum / denom / 255;
        resolve({
          width: img.width, height: img.height,
          aspect: (img.width || 1) / Math.max(1, img.height || 1),
          avgR: avgR, avgG: avgG, avgB: avgB,
          brightness: brightness, avgSat: avgSat,
          greenRatio: greenCount / n,
          copperRatio: copperCount / n,
          grayRatio: grayCount / n,
          darkRatio: darkCount / n,
          brightRatio: brightCount / n,
          edgeDensity: edgeDensity
        });
      } catch(err){ reject(err); }
    };
    img.onerror = function(){ reject(new Error('image load failed')); };
    img.src = dataUrl;
  });
}

function classifyFromFeatures(f){
  var scores = {};
  function add(cat, v){ scores[cat] = (scores[cat] || 0) + v; }
  var wide  = f.aspect > 1.15;
  var tall  = f.aspect < 0.90;
  var shiny = (f.brightRatio > 0.10) && (f.edgeDensity < 0.14);
  add('Motherboards / PCBs',                    f.greenRatio*340 + f.edgeDensity*130 + (f.greenRatio > 0.08 ? 40 : 0));
  add('Copper (Raw/Stripped)',                  f.copperRatio*380 + ((f.avgR > f.avgG && f.avgG > f.avgB) ? 50 : 0) + (f.avgSat > 0.30 ? 30 : 0));
  add('Aluminium (Scrap/Heatsinks)',            f.grayRatio*170 + f.brightRatio*180 + (f.brightness > 140 ? 40 : 0) + (f.avgSat < 0.15 ? 30 : 0));
  add('Iron / Steel (Chassis/Casings)',         f.darkRatio*170 + f.grayRatio*140 + (f.brightness < 95 ? 45 : 0));
  add('Monitors / Screens / Displays',          (wide ? 80 : 0) + (f.edgeDensity < 0.12 ? 70 : 0) + (f.darkRatio > 0.20 ? 35 : 0) + (f.avgSat < 0.22 ? 35 : 0));
  add('Mobile Phones / Smartphones',            (tall ? 65 : 0) + (f.edgeDensity < 0.18 ? 45 : 0) + (f.avgSat < 0.25 ? 35 : 0) + ((f.grayRatio + f.darkRatio) > 0.5 ? 40 : 0));
  add('Laptops / Notebooks',                    (wide ? 75 : 0) + f.grayRatio*110 + f.darkRatio*60 + (f.edgeDensity > 0.09 ? 30 : 0));
  add('Speakers / Audio Equipment',             f.darkRatio*95 + (f.edgeDensity > 0.14 ? 55 : 0) + (f.avgSat < 0.30 ? 35 : 0) + (f.grayRatio > 0.25 ? 25 : 0));
  add('Radios / Cassette Players / Vintage Electronics', (f.copperRatio > 0.04 ? 55 : 0) + f.grayRatio*75 + (f.brightness < 130 ? 35 : 0) + (f.avgSat > 0.15 ? 20 : 0));
  add('CDs / DVDs / Optical Media',             (shiny ? 90 : 0) + f.brightRatio*120 + (f.avgSat < 0.20 ? 45 : 0) + (f.edgeDensity < 0.10 ? 40 : 0));
  add('Cables / Wires / Adapters',              f.copperRatio*200 + f.edgeDensity*90 + (f.avgSat > 0.20 ? 35 : 0));
  add('Battery (Lithium-ion/Lead-acid/NiCd)',   f.darkRatio*85 + (f.avgSat > 0.25 ? 30 : 0) + (f.grayRatio > 0.30 ? 45 : 0) + (f.edgeDensity < 0.14 ? 30 : 0));
  add('General Electrical Scrap & Small Appliances', 42 + f.edgeDensity*110);
  var sorted = Object.keys(scores).map(function(k){ return [k, scores[k]]; }).sort(function(a,b){ return b[1] - a[1]; });
  var top = sorted[0];
  var second = sorted[1] || ['', 0];
  var gap = top[1] - second[1];
  var confidence = Math.round(60 + Math.min(28, gap*0.35) + Math.min(8, top[1]*0.04));
  confidence = Math.max(58, Math.min(96, confidence));
  return { category: top[0], confidence: confidence, allScores: sorted };
}

function buildReasoning(category, f){
  var parts = [];
  if(f.greenRatio  > 0.08) parts.push('green-toned surface detected');
  if(f.copperRatio > 0.06) parts.push('warm copper/orange tones detected');
  if(f.grayRatio   > 0.45) parts.push('predominantly metallic/grey surface');
  if(f.darkRatio   > 0.30) parts.push('large dark regions');
  if(f.brightRatio > 0.12) parts.push('bright reflective areas');
  if(f.edgeDensity > 0.18) parts.push('high edge/texture density');
  else if(f.edgeDensity < 0.10) parts.push('smooth, low-texture surface');
  if(f.aspect > 1.15) parts.push('wide aspect ratio');
  else if(f.aspect < 0.90) parts.push('tall aspect ratio');
  var detail = parts.length ? parts.join(', ') : 'visual signature';
  return 'Image analysis matched ' + detail + ' to ' + category + '.';
}

function priceEstimate(category, weightKg){
  let pricingCat = category;
  const map = {
    'Motherboards / PCBs':'Motherboards / PCBs','Mobile Phones / Smartphones':'Mobile Phones / Smartphones',
    'Laptops / Notebooks':'Laptops / Notebooks','Cables / Wires / Adapters':'Cables / Wires / Adapters',
    'Copper (Raw/Stripped)':'Copper (Raw/Stripped)','Aluminium (Scrap/Heatsinks)':'Aluminium (Scrap/Heatsinks)',
    'Iron / Steel (Chassis/Casings)':'Iron / Steel (Chassis/Casings)',
    'Battery (Lithium-ion/Lead-acid/NiCd)':'Battery (Lithium-ion/Lead-acid/NiCd)'
  };
  if(map[category]) pricingCat = map[category];
  const m = state.materialPrices.find(p=>p.cat===pricingCat) || state.materialPrices.find(p=>p.cat===category) || state.materialPrices[0];
  const perKg = m.price;
  const isUnitBased = m.unit==='unit' || /Monitors|Speakers|Laptops|Phones/.test(category);
  const total = isUnitBased ? perKg*Math.max(1,Math.round(weightKg)) : perKg*weightKg;
  const conf = Math.round(80+Math.random()*15);
  return {perKg, unit: m.unit, total:Math.round(total), trend:m.trend, confidence:conf,
    explanation:`Based on ${Math.abs(m.trend)}% ${m.trend>=0?'up':'down'} price movement in the last 8 weeks and current buyer demand.`};
}
function recommendRecyclers(category){
  return state.recyclers.map(r=>{
    const accepts = r.materials.includes(category);
    let score = 0;
    if(accepts) score += 50;
    score += Math.max(0, 20 - r.distance*1.2);
    score += (100-r.capacityPct)*0.15;
    score += r.rating*4;
    if(r.verified) score += 8;
    return {...r, matchScore:Math.round(Math.min(99,score))};
  }).filter(r=>r.matchScore>0).sort((a,b)=>b.matchScore-a.matchScore);
}
function detectAnomaly(category, weightKg){
  const typicalMax = {
    'Monitors / Screens / Displays':25, 'Motherboards / PCBs':8, 'Mobile Phones / Smartphones':6,
    'Laptops / Notebooks':12, 'Speakers / Audio Equipment':15, 'Radios / Cassette Players / Vintage Electronics':15,
    'CDs / DVDs / Optical Media':10, 'Cables / Wires / Adapters':12,
    'General Electrical Scrap & Small Appliances':25,
    'Copper (Raw/Stripped)':15, 'Aluminium (Scrap/Heatsinks)':20, 'Iron / Steel (Chassis/Casings)':40,
    'Battery (Lithium-ion/Lead-acid/NiCd)':6,
  }[category] || 15;
  if(weightKg > typicalMax*1.15){
    return {risk:'medium', issue:`Weight (${weightKg}kg) looks high for ${category}.`, action:'Flagged for buyer review before payout — no action needed from you now.'};
  }
  if(weightKg <= 0.05){
    return {risk:'high', issue:'Weight is too low for a listed item.', action:'Please re-check and re-enter the weight.'};
  }
  return {risk:'none', issue:null, action:null};
}

    e.stopPropagation();
    state.settings.theme = state.settings.theme==='light' ? 'dark' : 'light';
    save(); render();
  };
  const phoneInput = document.getElementById('phoneInput');
  if(phoneInput){
    phoneInput.addEventListener('input', e => {
      const cleaned = digitsOnly(e.target.value).slice(0,10);
      if(e.target.value !== cleaned) e.target.value = cleaned;
      authState.phone = cleaned;
    });
    phoneInput.addEventListener('keypress', e => { if(!/[0-9]/.test(e.key) && !e.ctrlKey && !e.metaKey) e.preventDefault(); });
    phoneInput.addEventListener('paste', e => {
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      const cleaned = digitsOnly(txt).slice(0,10);
      phoneInput.value = cleaned; authState.phone = cleaned;
    });
    phoneInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('sendOtp')?.click(); } });
  }
  const sendOtp = document.getElementById('sendOtp');
  if(sendOtp) sendOtp.onclick = ()=> withLock('send-otp', ()=>{
    const val = digitsOnly(document.getElementById('phoneInput').value);
    if(val.length !== 10){ toast('Please enter a valid 10-digit mobile number.', 'warn'); return; }
    authState.phone = val; authState.step='otp'; render(); toast('OTP sent (use 123456)');
  });
  const otpInput = document.getElementById('otpInput');
  if(otpInput){
    otpInput.addEventListener('input', e => {
      const cleaned = digitsOnly(e.target.value).slice(0,6);
      if(e.target.value !== cleaned) e.target.value = cleaned;
      if(cleaned.length === 6) document.getElementById('verifyOtp')?.click();
    });
    otpInput.addEventListener('keypress', e => { if(!/[0-9]/.test(e.key) && !e.ctrlKey && !e.metaKey) e.preventDefault(); });
    otpInput.addEventListener('paste', e => {
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      const cleaned = digitsOnly(txt).slice(0,6);
      otpInput.value = cleaned;
    });
    otpInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('verifyOtp')?.click(); } });
  }
  const verify = document.getElementById('verifyOtp');
  if(verify) verify.onclick = ()=> withLock('verify-otp', ()=>{
    const val = digitsOnly(document.getElementById('otpInput').value);
    if(val!=='123456'){ document.getElementById('otpError').style.display='block'; return; }
    state.session = {loggedIn:true, role:authState.role};
    if(authState.role==='collector') state.collector.phone = '+91 '+authState.phone;
    else state.recyclerUser.phone = '+91 '+authState.phone;
    save();
    currentRoute = {name: authState.role==='collector' ? 'dashboard' : 'recDashboard', params:{}};
    routeStack=[];
    try{ history.replaceState({route:currentRoute, stackLen:0}, ''); }catch(e){}
    toast('Welcome to DHAATU');
    render();
  });
}

function topLevel(name){
  if(['lotDetail','createLot','handover','payment','traceability'].includes(name)) return isCollector()?'dashboard':'recDashboard';
  if(['recyclerDetail'].includes(name)) return isCollector()?'marketplace':'recHub';
  if(['recLotDetail'].includes(name)) return 'recHub';
  if(name === 'recLots') return 'recDashboard';

}
function bindShellEvents(){
  document.querySelectorAll('[data-go]').forEach(b=>{ b.onclick = (e)=>{ e.stopPropagation(); navigate(b.dataset.go); }; });
  document.querySelectorAll('[data-guide-open]').forEach(b=>{ b.onclick = (e)=>{ e.stopPropagation(); openGuidanceModal(); }; });
  const lg = document.getElementById('sideLogout'); if(lg) lg.onclick = doLogout;

  const sideBrand = document.getElementById('sidebarBrand');
  if(sideBrand) sideBrand.onclick = (e)=>{ e.stopPropagation(); goHome(); };
  const topBrand = document.getElementById('topbarBrand');
  if(topBrand) topBrand.onclick = (e)=>{ e.stopPropagation(); goHome(); };

  const themeBtn = document.getElementById('themeToggleTop');
  if(themeBtn) themeBtn.onclick = (e)=>{
    e.stopPropagation();
    state.settings.theme = state.settings.theme==='light' ? 'dark' : 'light';
    save(); render();
  };

  const langBtn = document.getElementById('langBtn');
  const langMenu = document.getElementById('langMenu');
  if(langBtn && langMenu){
    langBtn.onclick = (e)=>{
      e.stopPropagation();
      const isOpen = langMenu.style.display !== 'none';
      closeAllPopups();
      if(!isOpen){
        langMenu.style.display = 'block';
        langBtn.classList.add('open');
        // CSS anchors the menu to the language button, so it stays aligned on desktop and mobile.
        langMenu.style.left = '';
        langMenu.style.top = '';
      }
    };
    langMenu.querySelectorAll('[data-pick-lang]').forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        state.settings.language = b.dataset.pickLang;
        save(); closeAllPopups(); render(); toast('Language changed');
      };
    });
  }

  document.addEventListener('click', closeAllPopups);
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeAllPopups(); });
}
function closeAllPopups(){
  const lm = document.getElementById('langMenu'); if(lm) lm.style.display = 'none';

function doLogout(){

let leafletMap = null;
let mapSelected = null;
function destroyLeafletMap(){ if(leafletMap){ try{ leafletMap.remove(); }catch(e){} leafletMap = null; } }
function setMapLocation(preset){
  const old = state.mapCenter || {lat:28.6139, lng:77.2090};
  const dLat = preset.lat - old.lat, dLng = preset.lng - old.lng;
  state.recyclers.forEach(r => {
    if (!r._baseLat) { r._baseLat = r.lat; r._baseLng = r.lng; }
    r.lat = +((r._baseLat + dLat).toFixed(4));
    r.lng = +((r._baseLng + dLng).toFixed(4));
  });
  state.mapCenter = {lat:preset.lat, lng:preset.lng, label:preset.label, presetId:preset.id};
  state.collectorLoc = {...state.collectorLoc, lat:preset.lat, lng:preset.lng, label:preset.label};
  state.recyclers.forEach(r=>{
    const R=6371, dLat2=(r.lat-preset.lat)*Math.PI/180, dLng2=(r.lng-preset.lng)*Math.PI/180;
    const s=Math.sin(dLat2/2)**2+Math.cos(preset.lat*Math.PI/180)*Math.cos(r.lat*Math.PI/180)*Math.sin(dLng2/2)**2;
    r.distance = +(R*2*Math.asin(Math.sqrt(s))).toFixed(1);
  });
  save();
}
function initLeafletMap(){
  const container = document.getElementById('leafletMap');
  if(!container || typeof L === 'undefined') return;
  destroyLeafletMap();
  const center = state.mapCenter || {lat:28.6139, lng:77.2090};
  leafletMap = L.map(container, {center:[center.lat, center.lng], zoom:13, zoomControl:true, attributionControl:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Tiles © Esri'}).addTo(leafletMap);
  L.tileLayer('https://stamen-tiles.a.ssl.fastly.net/toner-labels/{z}/{x}/{y}.png', {maxZoom:18, opacity:0.45}).addTo(leafletMap);
  const userIcon = L.divIcon({className:'', html:'<div class="map-user-dot"></div>', iconSize:[18,18], iconAnchor:[9,9]});
  L.marker([center.lat, center.lng], {icon:userIcon}).addTo(leafletMap).bindPopup('<b>You are here</b><br>'+esc(center.label||''));
  state.recyclers.forEach(r=>{
    const recyclerIcon = L.divIcon({className:'', html:'<div class="map-recycler-dot '+(r.verified?'verified':'')+'"></div>', iconSize:[16,16], iconAnchor:[8,8]});
    const m = L.marker([r.lat, r.lng], {icon:recyclerIcon}).addTo(leafletMap);
    m.bindPopup('<b>'+esc(r.name)+'</b><br>'+esc(r.city)+'<br>★ '+r.rating+' · '+r.distance+'km away<br><span style="color:#8de0cf;">'+esc(r.materials.slice(0,3).join(', '))+'</span>');
    m.on('click', ()=>{ mapSelected = r.id; setTimeout(()=>{ if(currentRoute.name==='map') render(); }, 50); });
  });
  setTimeout(()=>{ if(leafletMap) leafletMap.invalidateSize(); }, 200);
}
function viewMap(){

function publishLot(){
  withLock('publish-lot', ()=>{
    const p = wizard.priceInfo;
    let imgSafe = wizard.imgData;
    if(imgSafe && imgSafe.length > 400000) imgSafe = null;
    const lot = {id: uid('LOT'), category:wizard.category, weight:parseFloat(wizard.weight), unit:wizard.unit, status:'matched',
      collectorId: state.collector.id, recyclerId: wizard.chosenRecycler, price: p.total, createdAt: new Date().toISOString(),
      img: imgSafe, condition: wizard.condition||'Not given', quantity: wizard.quantity||'—', notes: wizard.notes,
      location: state.collectorLoc.label, seller: state.collector.name, bids:[]};
    state.lots.unshift(lot);
    const buyer = recyclerOf(lot.recyclerId);
    state.notifications.unshift({id:uid('N'), title:'Item added: '+lot.id, body:`${lot.category} matched to ${buyer ? buyer.name : 'a buyer'}.`, time:new Date().toISOString(), read:false, type:'offer'});
    save();
    wizard = null;
    toast('Item '+lot.id+' posted successfully');
    currentRoute = {name:'lotDetail', params:{id:lot.id}};
    routeStack = [];
    try{ history.pushState({route:currentRoute, stackLen:0}, ''); }catch(e){}
    render();
  });
}

const HANDOVER_CHAIN = ['created','matched','collected','handover_confirmed','processing','recycled'];

function viewHandover(params){
  const l = byId(state.lots, params.id); if(!l) return emptyBlock('warn','Item not found','');
  const idx = Math.max(0, HANDOVER_CHAIN.indexOf(l.status));
  const r = l.recyclerId ? recyclerOf(l.recyclerId) : null;
  const nextAction = handoverNextAction(l);
  return `${backRow()}
  ${pageTitle('Pickup status', l.id)}

    <div class="card card-pad">
      <div class="timeline">
        ${HANDOVER_CHAIN.map((s,i)=>`<div class="tl-item ${i<idx?'done':i===idx?'current':'pending'}">
          <div class="tl-dot">${i<idx?icon('check'):''}</div>
          <div class="tl-title">${HANDOVER_LABELS[s]}</div>
          ${i===idx? `<div class="tl-time">Now here</div>`: i<idx? `<div class="tl-time">Done</div>`:''}
        </div>`).join('')}
      </div>
    </div>
  </div>
  <div class="section" style="padding-top:0;">
    <div class="card card-pad">
      <div class="kv"><span class="k">Buyer</span><span class="v">${r?esc(r.name):'—'}</span></div>
      <div class="kv"><span class="k">Weight</span><span class="v">${l.weight}${l.unit}</span></div>
      <div class="kv"><span class="k">Final price</span><span class="v">${money(l.price)}</span></div>
      <div class="kv"><span class="k">Pickup ID</span><span class="v mono">HND-${l.id.split('-')[1]||l.id}</span></div>
    </div>
  </div>
  ${nextAction? `<div class="section" style="padding-top:0;"><button class="btn btn-primary btn-block" id="handoverAction">${esc(nextAction.label)}</button></div>`:''}`;
}
function handoverNextAction(l){
  if(l.status==='matched') return {label:'Mark as picked up', next:'collected'};
  if(l.status==='collected') return {label: isCollector()? 'Waiting for weight check' : 'Check weight', next: isCollector()? null : 'weight_verify'};
  if(l.status==='handover_confirmed') return {label:'Go to payment', next:'gopay'};
  return null;
}
function advanceHandover(l){
  if(!l) return;
  const action = handoverNextAction(l);
  if(!action || !action.next) return;
  if(action.next==='gopay'){ navigate('payment',{id:l.id}); return; }
  if(action.next==='weight_verify'){
    l.status='handover_confirmed';
    state.notifications.unshift({id:uid('N'), title:'Weight checked', body:`${l.id} weight confirmed at ${l.weight}${l.unit}.`, time:new Date().toISOString(), read:false, type:'weight'});
    toast('Weight checked, pickup confirmed');
  } else {
    l.status = action.next;
    toast('Status updated: '+STATUS_LABEL[l.status]);
  }
  save(); render();
}

let payState = {method:'upi', processing:false};
function viewPayment(params){
  const l = byId(state.lots, params.id); if(!l) return emptyBlock('warn','Item not found','');
  let tx = state.transactions.find(x=>x.lotId===l.id);
  if(payState.processing){
    return `${backRow()}${pageTitle('Payment in progress')}
    <div class="section"><div class="card card-pad" style="text-align:center;padding:40px 16px;">
      <div class="skel" style="width:52px;height:52px;border-radius:50%;margin:0 auto 14px;"></div>

      <p style="font-size:12.5px;color:var(--ink-soft);">Simulated gateway — do not close this screen.</p>
    </div></div>`;
  }
  if(tx && tx.paymentState==='completed'){
    return `${backRow()}${pageTitle('Payment done')}
    <div class="section"><div class="card card-pad" style="text-align:center;">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--circuit);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;">${icon('check')}</div>
      <div style="font-family:var(--font-display);font-size:24px;font-weight:700;">${money(tx.amount)}</div>
      <p style="font-size:12.5px;color:var(--ink-soft);">Paid via ${tx.method} · ${tx.id}</p>
      <button class="btn btn-secondary btn-block" id="viewReceiptBtn" style="margin-top:10px;">View receipt</button>
    </div></div>`;
  }
  return `${backRow()}${pageTitle('Payment', l.id)}
  <div class="section" style="padding-top:6px;">
    <div class="card card-pad" style="text-align:center;">
      <div style="font-size:12px;color:var(--ink-soft);">Amount to pay</div>
      <div style="font-family:var(--font-display);font-size:30px;font-weight:700;">${money(l.price)}</div>
    </div>
  </div>
  <div class="section" style="padding-top:0;">
    <div class="section-head"><h2>Choose mode</h2></div>
    <div class="seg"><button type="button" data-pm="upi" class="${payState.method==='upi'?'active':''}">UPI</button><button type="button" data-pm="bank" class="${payState.method==='bank'?'active':''}">Bank transfer</button></div>
  </div>
  ${payState.method==='upi'? `<div class="section" style="padding-top:0;"><div class="field"><label>UPI ID</label><input id="upiId" placeholder="yourname@upi" value="collector@dhaatu"></div></div>`
   : `<div class="section" style="padding-top:0;"><div class="field"><label>Bank account</label><input value="XXXX XXXX 4521" disabled></div></div>`}
  <div class="section" style="padding-top:0;"><button class="btn btn-primary btn-block" id="payNow">${icon('upi')} Pay ${money(l.price)}</button></div>`;
}
function processPayment(l){
  if(!l) return;
  withLock('payment-'+l.id, ()=>{
    payState.processing = true; render();
    setTimeout(()=>{
      const success = Math.random() > 0.08;
      payState.processing = false;
      if(success){
        let tx = state.transactions.find(x=>x.lotId===l.id);
        if(!tx){
          tx = {id:uid('TXN'), lotId:l.id, recyclerId:l.recyclerId, amount:l.price, method: payState.method==='upi'?'UPI':'Bank transfer', paymentState:'completed', handoverState:'confirmed', createdAt:new Date().toISOString()};
          state.transactions.unshift(tx);
        } else { tx.paymentState='completed'; }
        l.status='processing';
        state.notifications.unshift({id:uid('N'), title:'Payment done', body:`${money(l.price)} credited for ${l.id}.`, time:new Date().toISOString(), read:false, type:'payment'});
        save(); toast('Payment done'); render();
      } else {
        toast('Payment failed — try again', 'warn');
        render();
      }
    }, 1400);
  });
}
