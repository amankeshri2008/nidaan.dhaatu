function openEditProfile(){
  const u = currentUser();
  const hasPhoto = !!u.profilePhoto;
  openSheet('Edit profile', `
  <div class="profile-photo-wrap">
    <label class="profile-photo-btn" for="epPhoto">
      <div class="photo-frame">
        ${hasPhoto ? `<img src="${u.profilePhoto}" alt="Profile" id="epPhotoPreview">` : `<span id="epPhotoInitials" style="font-size:28px;font-weight:800;">${esc(u.avatarInitials)}</span>`}
      </div>
      <div class="cam-badge">${icon('camera')}</div>
    </label>
    <input type="file" id="epPhoto" accept="image/*" style="display:none;">
    <div class="profile-photo-help">Tap the circle to upload a profile photo</div>
  </div>
  <div class="field"><label>Name</label><input id="epName" value="${esc(u.name)}"></div>
  <div class="field"><label>Phone</label><input id="epPhone" type="tel" inputmode="numeric" maxlength="14" value="${esc(u.phone)}"></div>
  <div class="field">
    <label>${isCollector()?'Location':'City'}</label>
    <div class="row" style="gap:8px;">
      <input id="epLoc" value="${esc(isCollector()?u.village:u.city)}" style="flex:1;min-width:0;">
      <button class="gps-detect-btn" id="epGpsBtn" type="button" title="Auto-detect via GPS">${icon('gps')} GPS</button>
    </div>
    <div class="hint" id="epGpsHint" style="display:none;">Fetching your location…</div>
  </div>
  <button class="btn btn-primary btn-block" id="epSave">Save changes</button>`,
  {onMount:()=>{
    const photoInput = document.getElementById('epPhoto');
    if(photoInput) photoInput.onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      if(!f.type.startsWith('image/')){ toast('Please choose an image file','warn'); return; }
      if(f.size > 4 * 1024 * 1024){ toast('Image is too large. Please choose a smaller photo.','warn'); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        u._pendingPhoto = reader.result;
        const frame = document.querySelector('#epPhoto').previousElementSibling.querySelector('.photo-frame');
        if(frame){ frame.innerHTML = `<img src="${reader.result}" alt="Profile">`; }
        toast('Photo ready — tap Save changes');
      };
      reader.readAsDataURL(f);
    };
    const gpsBtn = document.getElementById('epGpsBtn');
    const gpsHint = document.getElementById('epGpsHint');
    if(gpsBtn) gpsBtn.onclick = ()=>{
      if(!navigator.geolocation){ toast('Location not available.','warn'); return; }
      gpsBtn.disabled = true;
      gpsBtn.classList.add('loading');
      if(gpsHint) gpsHint.style.display = 'block';
      navigator.geolocation.getCurrentPosition(
        async pos => {
          try{
            const {latitude, longitude} = pos.coords;
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
            const data = await resp.json();
            const a = data.address || {};
            const city = a.city || a.town || a.village || a.county || '';
            const state = a.state || '';
            const country = a.country || '';
            const locStr = [city, state, country].filter(Boolean).join(', ') || `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
            document.getElementById('epLoc').value = locStr;
            toast('Location detected');
          } catch(err){
            document.getElementById('epLoc').value = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            toast('Coordinates captured');
          } finally {
            gpsBtn.disabled = false;
            gpsBtn.classList.remove('loading');
            if(gpsHint) gpsHint.style.display = 'none';
          }
        },
        err => {
          toast('Location permission denied.','warn');
          gpsBtn.disabled = false;
          gpsBtn.classList.remove('loading');
          if(gpsHint) gpsHint.style.display = 'none';
        },
        {enableHighAccuracy:true, timeout:9000, maximumAge:60000}
      );
    };
    document.getElementById('epSave').onclick = ()=> withLock('edit-profile', ()=>{
      u.name = document.getElementById('epName').value.trim()||u.name;
      u.phone = document.getElementById('epPhone').value.trim()||u.phone;
      const loc = document.getElementById('epLoc').value.trim();
      if(isCollector()) u.village = loc||u.village; else u.city = loc||u.city;
      if(u._pendingPhoto){ u.profilePhoto = u._pendingPhoto; delete u._pendingPhoto; }
      u.avatarInitials = u.name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
      save(); closeSheet(); toast('Profile updated'); render();
    });
  }});
}

/* ============ BID HANDLERS ============ */
function bindBidActions(root){
  root.querySelectorAll('[data-bid-accept]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const bidId = el.dataset.bidAccept;
      const lotId = el.dataset.bidLot;
      const lot = byId(state.lots, lotId);
      if(!lot || !lot.bids) return;
      if(!(isCollector() && lot.collectorId === state.collector.id)){ toast('Only the lot owner can accept bids.','warn'); return; }
      const accepted = lot.bids.find(b=>b.id===bidId);
      if(!accepted || accepted.status !== 'pending'){ toast('This bid is no longer pending.','warn'); return; }
      lot.bids.forEach(b=>{ b.status = (b.id === bidId) ? 'accepted' : (b.status==='pending'?'rejected':b.status); });
      lot.recyclerId = accepted.recyclerId;
      lot.price = accepted.amount;
      lot.status = 'handover_confirmed';
      (state.recyclerBids||[]).forEach(rb=>{ if(rb.lotId===lot.id){ rb.status = (rb.id===bidId||rb.amount===accepted.amount)? 'accepted' : (rb.status==='pending'?'rejected':rb.status); } });
      state.transactions.unshift({id:uid('TXN'), lotId:lot.id, recyclerId:accepted.recyclerId, amount:accepted.amount, method:'UPI', paymentState:'pending', handoverState:'confirmed', createdAt:new Date().toISOString()});
      save(); render(); toast('Offer accepted: '+money(accepted.amount));
    };
  });
  root.querySelectorAll('[data-bid-reject]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const bidId = el.dataset.bidReject;
      const lotId = el.dataset.bidLot;
      const lot = byId(state.lots, lotId);
      if(!lot || !lot.bids) return;
      lot.bids.forEach(b=>{ if(b.id===bidId && b.status==='pending') b.status='rejected'; });
      (state.recyclerBids||[]).forEach(rb=>{ if(rb.id===bidId) rb.status='rejected'; });
      save(); render(); toast('Bid rejected');
    };
  });
  root.querySelectorAll('[data-place-procurement-bid]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const lotId = el.dataset.placeProcurementBid;
      const l = byId(state.procurementLots, lotId);
      if(!l) return;
      if(l.status !== 'open'){ toast('This lot has been closed.','warn'); return; }
      const minBid = Math.max(1, Math.round(l.price * 0.5));
      openSheet('Place Bid on Lot', `
        <div class="kv"><span class="k">Lot ID</span><span class="v">#${esc(l.id)}</span></div>
        <div class="kv"><span class="k">Material</span><span class="v">${esc(l.material)}</span></div>
        <div class="kv"><span class="k">Volume</span><span class="v">${esc(l.volume)}</span></div>
        <div class="kv"><span class="k">Purity</span><span class="v">${esc(l.purity)}</span></div>
        <div class="kv"><span class="k">Est. Total</span><span class="v">${money(l.price)}</span></div>
        <div class="field" style="margin-top:12px;">
          <label>Bid Amount (₹)</label>
          <input id="bidAmount" type="number" min="${minBid}" step="1" inputmode="decimal" value="${Math.round(l.price*1.05)}">
          <span class="hint">Minimum: ${money(minBid)}</span>
        </div>
        <button class="btn btn-primary btn-block" id="bidSubmit">${icon('check')} Submit Bid</button>`,
        {onMount:()=>{
          const bidAmountInput = document.getElementById('bidAmount');
          bidAmountInput.addEventListener('input', ()=>{
            const v = parseFloat(bidAmountInput.value);
            bidAmountInput.classList.toggle('invalid', !(v >= minBid));
          });
          document.getElementById('bidSubmit').onclick = ()=> withLock('place-bid', ()=>{
            const amt = parseFloat(document.getElementById('bidAmount').value);
            if(!Number.isFinite(amt) || amt < minBid){ toast('Bid must be at least '+money(minBid)+'.','warn'); return; }
            if(!l.bids) l.bids = [];
            l.bids.unshift({id:uid('B'), recyclerId:state.recyclerUser.recyclerId, amount:amt, createdAt:new Date().toISOString(), status:'pending'});
            if(!state.recyclerBids) state.recyclerBids = [];
            state.recyclerBids.unshift({id:uid('BID'), lotId:l.id, recyclerId:state.recyclerUser.recyclerId, amount:amt, createdAt:new Date().toISOString(), status:'pending'});
            save(); closeSheet(); render();
            toast('Bid placed successfully');
          });
        }});
    };
  });
}

function downloadChainOfCustodyPDF(batchId){
  const record = (state.ledgerRecords||[]).find(r=>r.batchId===batchId);
  if(!record){ toast('Record not found','warn'); return; }
  const certId = 'COC-'+record.batchId+'-'+Date.now().toString().slice(-6);
  const dateStr = new Date(record.dateReceived).toLocaleDateString('en-IN', { year:'numeric', month:'long', day:'numeric' });
  const content = `%PDF-1.4\n1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>\nendobj\n4 0 obj\n<< /Length 1200 >>\nstream\nBT\n/F1 18 Tf\n50 750 Td\n(DHAATU - Chain of Custody Certificate) Tj\n0 -30 Td\n/F1 12 Tf\n(Certificate ID: ${certId}) Tj\n0 -25 Td\n(Batch ID: ${record.batchId}) Tj\n0 -25 Td\n(Collector: ${record.collector}) Tj\n0 -25 Td\n(Date Received: ${dateStr}) Tj\n0 -25 Td\n(Certificate Status: ${record.certStatus === 'verified' ? 'Verified & Signed' : record.certStatus === 'pending' ? 'Pending' : 'Expired'}) Tj\n0 -25 Td\n(Chain of Custody: ${record.chainStatus}) Tj\n0 -40 Td\n/F1 10 Tf\n(This is a simulated document for demonstration purposes.) Tj\n0 -15 Td\n(Issued by DHAATU - Project NIDAAN) Tj\nET\nendstream\nendobj\n5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\nxref\n0 6\n0000000000 65535 f \n0000000009 00000 n \n0000000058 00000 n \n0000000115 00000 n \n0000000266 00000 n \n0000001510 00000 n \ntrailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n1591\n%%EOF\n`;
  const blob = new Blob([content], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `CoC_${record.batchId}.pdf`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('File downloaded');
}

  if(useManual) useManual.onclick = ()=>{
    const sel = document.getElementById('manualCat').value;
    if(!sel){ toast('Select a type first','warn'); return; }
    wizard.classification = { category:sel, confidence:100, subComponents:['User identified'], condition:['User identified'], safetyWarning:null, weightRange:'—', reasoning:'Manually confirmed by seller.' };
    wizard.category = sel;
    render();
  };
  const notRight = document.getElementById('wizNotRight'); if(notRight) notRight.onclick = ()=>{ wizard.classification=null; render(); };
  const n2 = document.getElementById('wizNext2'); if(n2) n2.onclick = ()=>{ wizard.step=3; render(); };

  root.querySelectorAll('[data-unit]').forEach(el=> el.onclick=()=>{ wizard.unit=el.dataset.unit; render(); });

  const wInput = document.getElementById('wizWeight');
  if(wInput){
    wInput.addEventListener('input', ()=>{
      let v = wInput.value;
      const cleaned = v.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');
      if(v !== cleaned) wInput.value = cleaned;
      const num = parseFloat(cleaned);
      const errEl = document.getElementById('weightErr');
      if(errEl) errEl.style.display = (Number.isFinite(num) && num>0 && num<=5000) ? 'none' : 'block';
    });
  }
  const n3 = document.getElementById('wizNext3'); if(n3) n3.onclick = ()=>{
    const v = parseFloat(document.getElementById('wizWeight').value);
    const errEl = document.getElementById('weightErr');
    if(!Number.isFinite(v) || v <= 0 || v > 5000){ if(errEl) errEl.style.display='block'; return; }
    wizard.weight = v; wizard.step=4; wizard.priceInfo=null; render();
  };
  root.querySelectorAll('[data-pickup]').forEach(el=> el.onclick=()=>{ wizard.pickupNow = el.dataset.pickup==='now'; render(); });
  const n4 = document.getElementById('wizNext4'); if(n4) n4.onclick = ()=>{
    wizard.condition = document.getElementById('wizCondition').value.trim();
    wizard.quantity = document.getElementById('wizQuantity').value.trim();
    wizard.notes = document.getElementById('wizNotes').value.trim();
    wizard.step=5; render();
  };
  const n5 = document.getElementById('wizNext5'); if(n5) n5.onclick = ()=>{ wizard.step=6; render(); };
  root.querySelectorAll('[data-choose]').forEach(el=> el.onclick=()=>{ wizard.chosenRecycler=el.dataset.choose; render(); });
  const pub = document.getElementById('wizPublish'); if(pub) pub.onclick = publishLot;
}

/* ============ INIT ============ */
try{ history.replaceState({route:currentRoute, stackLen:0}, ''); }catch(e){}
render();
</script>
</body>
</html>
